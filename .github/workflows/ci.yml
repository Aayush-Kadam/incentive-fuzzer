name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tests
        run: python -m pip install ".[test]"
      - name: Run test suite
        run: python -m pytest
      - name: CLI smoke test
        run: |
          incentive-fuzzer --version
          incentive-fuzzer validate examples/scholarship_cliff.yaml
      - name: Quick reproduction and benchmark integrity
        run: python scripts/reproduce.py quick
