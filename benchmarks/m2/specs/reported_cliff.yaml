incentive_spec_version: '0.1'
institution:
  id: reported_cliff
  name: Reported Cliff
  description: Frozen synthetic M2 mechanism
  version: '1'
parameters:
  threshold:
    type: money
    value: 10
    provenance: S
  award:
    type: money
    value: 7
    provenance: S
  cost_rate:
    type: decimal
    unit: rate
    value: 0
    provenance: A
attributes:
  true_income:
    type: money
    lower: 0
    upper: 30
    observable: false
    manipulable: false
    role: latent
  reported_income:
    type: money
    lower: 0
    upper: 30
    observable: true
    manipulable: true
    role: reported
actions:
  deviation:
    controls:
      amount:
        type: money
        lower: 0
        upper: 10
    feasibility:
      le:
      - var: amount
      - var: reported_income
    transition:
      reported_income:
        sub:
        - var: reported_income
        - var: amount
    cost:
      mul:
      - var: cost_rate
      - var: amount
rules:
  benefit_a:
    if:
      condition:
        lt:
        - var: reported_income
        - var: threshold
      then:
        var: award
      else:
        const:
          value: 0
          unit: money
  resources:
    add:
    - var: true_income
    - &id001
      var: benefit_a
utility:
  sub:
  - var: resources
  - var: action_cost
designer_outcomes:
  fiscal_cost: *id001
properties: []
